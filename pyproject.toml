[project]
name = "yt-knowledge-extractor"
version = "0.1.4"
description = "유튜버 한 명의 말 중심 콘텐츠를 개념 단위 지식베이스로 가공하는 PoC"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "imageio-ffmpeg>=0.5.1",
    # CPU STT 물리 코어 수 자동 감지용(stage3_stt._detect_physical_cpu_threads). 가볍고
    # 모든 CPU 사용자에게 이득이라 core 의존성으로 둔다(감지 실패 시에도 안전하게 폴백).
    "psutil>=5.9",
    # GUI(flet)는 이 앱의 일급 기능(`yke-gui`)이므로 기본 의존성으로 둔다. optional extra 로
    # 두면 uv 가 명령마다 환경을 재동기화하며 flet 을 설치/삭제 반복한다. flet-desktop 은
    # flet 본체를 함께 끌어온다.
    # flet build 는 이 제약으로 번들용 flet 을 별도 설치하므로 >= 로 두면 최신(예: 0.86.x)을
    # 끌어와 번들 flet 과 flet-cli 가 만든 UI 클라이언트(0.85.x) 버전이 어긋난다. 그러면 앱은
    # 뜨지만 화면이 안 그려진다(빈 창). flet-cli 와 정확히 같은 버전으로 고정한다.
    "flet-desktop==0.85.3",
    # 설치/자동 업데이트(Velopack). velopack 휠은 abi3(cp37-abi3)라 flet 임베디드 Python
    # 버전과 무관하게 번들에 포함된다. GUI 가 UpdateManager 로 GitHub Releases 업데이트를
    # 받는 데 쓴다(설치/업데이트 라이프사이클 훅은 파이썬이 아니라 네이티브 러너에서
    # 처리한다 — scripts/flet_template.py 참고).
    "velopack>=1.2.0",
    # LLM 프로바이더로 Google Gemini(BYOK) 를 지원한다. 배포된 end-user 는 로컬 `claude` CLI
    # 가 없으므로, 본인 Gemini API 키로 지식 추출·통합·자막 보정을 쓸 수 있어야 한다 →
    # google-genai(신 통합 SDK)를 코어 의존성으로 번들한다(optional 이면 설치기 사용자가
    # `uv sync --extra` 를 못 하므로). Claude 만 쓰는 경우엔 import 되지 않는다(gemini_client
    # 는 provider=gemini 일 때만 지연 로딩).
    "google-genai>=1.0",
    # API 키(BYOK)는 평문 설정 파일이 아니라 OS 자격증명 저장소(Windows 자격증명 관리자)에
    # 보관한다. keyring 은 순수 파이썬 + Windows 내장 백엔드(ctypes)라 번들이 가볍다.
    "keyring>=25.0",
]

[project.optional-dependencies]
# GPU(NVIDIA CUDA 12) STT 가속용. CTranslate2 4.8 은 cuDNN 로더(cudnn64_9.dll)를 자체
# 번들하고 whisper 추론엔 cuBLAS 만 쓰므로(RTX 2080 실측 확인) cuBLAS 만 넣는다.
# 설치: `uv sync --extra gpu`  (CPU 전용 환경에서는 불필요)
gpu = ["nvidia-cublas-cu12"]
# 경량 오프라인 STT 대안 엔진(sherpa-onnx, stage3_stt_sherpa 참고). 대부분의 사용자는 쓰지
# 않는 대안 경로라 gpu 와 같은 이유로 optional 로 둔다. 설치: `uv sync --extra sherpa`
#
# 이 자리에는 원래 Vosk 가 있었으나, PyPI 릴리스가 0.3.45(2022-12)에서 멈추고 macOS 휠은
# 0.3.44(2022-09)가 마지막이라 macOS(특히 Apple Silicon)에서 설치 자체가 실패했다.
# sherpa-onnx 는 같은 Kaldi 계보(k2-fsa)의 후속으로 Windows·macOS(Intel/Apple Silicon)·
# Linux 휠을 모두 제공하고 월 단위로 릴리스된다(2026-07 기준 1.13.x).
#
# 두 패키지를 같은 버전으로 함께 고정한다: sherpa-onnx 휠은 네이티브 런타임
# (libonnxruntime)이 든 sherpa-onnx-core 를 `==같은 버전`으로 요구하지만, uv 는 이
# 패키지를 sdist 메타데이터 기준으로 잠가 그 의존성을 못 본다(실측: core 가 빠진 채
# 설치돼 import 시 libonnxruntime 을 못 찾고 죽음). 버전을 올릴 땐 둘 다 같이 올린다
# (flet-desktop/flet-cli 를 같은 버전으로 묶는 것과 같은 이유).
sherpa = [
    "sherpa-onnx==1.13.4",
    "sherpa-onnx-core==1.13.4",
]

[project.scripts]
yke = "yke.run:main"
yke-gui = "yke.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yke"]

[tool.uv]
# sherpa-onnx 는 소스 빌드를 금지하고 배포 휠만 쓴다. 소스(sdist)로 떨어지면 uv 가 그
# 빌드 메타데이터를 잠가 네이티브 런타임 패키지(sherpa-onnx-core)가 빠지고, import 시
# libonnxruntime 을 못 찾아 죽는다(macOS arm64 에서 실측). 게다가 소스 빌드는 CMake
# 툴체인이 필요해 사용자 환경에서 실패한다 — 전 플랫폼 휠이 제공되므로 휠만 쓰면 된다.
no-build-package = ["sherpa-onnx"]

[dependency-groups]
# flet-cli 는 `flet build`(네이티브 빌드) 전용 도구다. 선언하지 않으면 `uv sync` 가
# 매번 "불필요"로 보고 제거하고, 직후 `flet build` 가 다시 설치해 설치/삭제가 반복된다.
# pytest 도 마찬가지로 선언 없이 설치하면 `uv sync`(scripts/setup.py 포함) 가 매번
# 지워버린다. dev 그룹에 두면 sync 가 보존해 이 churn 을 없앤다.
# flet-cli 는 UI 클라이언트(Flutter) 버전을 결정한다. 번들 flet-desktop 과 반드시 같은
# 버전으로 고정해야 렌더링 프로토콜이 맞는다(불일치 시 빈 창).
dev = ["flet-cli==0.85.3", "pytest>=8.0"]

[tool.flet.app]
# src-layout 이므로 flet build 가 src/ 아래에서 진입 모듈을 찾도록 지정한다.
# module 은 점을 확장자 구분자로 다루므로 dotted 경로(yke.gui)는 yke.py 를 찾다 실패한다.
# 앱 루트의 main.py 셔임을 진입점으로 둔다.
module = "main"
path = "src"

# 앱을 여는 동안 빈 창 대신 진행 표시를 보여준다(체감 속도). 설치 직후 첫 실행은 번들
# (app.zip)을 푸는 시간이, 그 뒤 실행은 파이썬 인터프리터 기동 + import 시간이 필요한데,
# 그동안 창이 비어 있으면 '멈춘 것처럼' 보인다.
[tool.flet.app.boot_screen]
# 설치/업데이트 직후 첫 실행에서 앱 파일을 푸는 동안(수 초).
show = true
message = "처음 실행 준비 중… (잠시만 기다려 주세요)"

[tool.flet.app.startup_screen]
# 파이썬 쪽 UI 가 붙기 전까지.
show = true
message = "유튜브 지식 추출기를 여는 중…"
